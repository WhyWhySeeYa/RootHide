name: Auto-patch build & release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支（默认当前默认分支）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
  IOS_SDK_VERSION: "16.5"
  TRUSTCACHE_COMMIT: aa0e8847529cf76576fce8d2dbc9e088c8f1a0df

jobs:
  patch-build-release:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Apply auto-auth patch (robust semantic patch)
        run: |
          set -euo pipefail
          # 语义化补丁：按函数签名定位替换，不依赖行号
          python3 .github/scripts/auto-auth.py
          git add Application/
          if ! git diff --cached --quiet; then
            git -c user.name="Auto-Patch" -c user.email="actions@users.noreply.github.com" \
              commit -m "auto-auth: apply no-verify patch on $(git rev-parse --short HEAD)"
            echo "patched=true" >> "$GITHUB_ENV"
          else
            echo "patched=false" >> "$GITHUB_ENV"
          fi

      - name: Apply submodule patches
        run: |
          set -euo pipefail
          git -C BaseBin/XPF apply "$GITHUB_WORKSPACE/.github/patches/XPF-roothide.patch"
          git -C BaseBin/opainject apply "$GITHUB_WORKSPACE/.github/patches/opainject-build.patch"

      - name: Capture source provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "head=$(git rev-parse HEAD)"
            echo "auto_auth_patched=${patched:-false}"
            echo "version=$(tr -d '\r\n' < BaseBin/_external/basebin/.version)"
            echo "xcode_requested=15.4"
            echo "theos_commit=$THEOS_COMMIT"
            echo "trustcache_commit=$TRUSTCACHE_COMMIT"
            echo "patches:"
            shasum -a 256 .github/scripts/auto-auth.py .github/patches/XPF-roothide.patch .github/patches/opainject-build.patch
          } > artifacts/source-provenance.txt
          cat artifacts/source-provenance.txt

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils

      - name: Install host dependencies
        run: |
          set -euo pipefail
          brew install make libarchive openssl@3 xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-sdk${{ env.IOS_SDK_VERSION }}

      - name: Install Theos and iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

          mkdir -p "$THEOS/sdks"
          sdk_archive="$RUNNER_TEMP/iPhoneOS${IOS_SDK_VERSION}.sdk.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS${IOS_SDK_VERSION}.sdk.tar.xz" \
            --output "$sdk_archive"
          tar -xJf "$sdk_archive" -C "$THEOS/sdks"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode15.4-${{ hashFiles('**/Package.swift', '**/project.pbxproj') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode15.4-

      - name: Build trustcache
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/trustcache"
          git clone https://github.com/CRKatri/trustcache.git "$source_dir"
          git -C "$source_dir" checkout --detach "$TRUSTCACHE_COMMIT"

          openssl_prefix="$(brew --prefix openssl@3)"
          make -C "$source_dir" -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1 \
            CFLAGS="-DOPENSSL -I${openssl_prefix}/include" \
            LDFLAGS="-L${openssl_prefix}/lib"
          make -C "$source_dir" install PREFIX="$HOME/.local"

      - name: Verify build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "17.5"
          test -d "$THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"
          command -v make ldid
          make --version | head -n 1
          command -v trustcache
          file "$(command -v trustcache)"

      - name: Verify RootHide systemhook path contract
        run: |
          set -euo pipefail
          ! grep -R -n -E '^#define HOOK_DYLIB_PATH[[:space:]]+"/usr/lib/systemhook\.dylib"' \
            BaseBin/systemhook/src
          grep -F 'extern const char *HOOK_DYLIB_PATH;' \
            BaseBin/systemhook/src/common/common.h

      - name: Full build TIPA
        run: |
          set -euo pipefail
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/clang-module-cache"
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          make -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1

          version="$(cat BaseBin/_external/basebin/.version)-$(git rev-parse --short HEAD)"
          artifact="Dopamine_${version}_roothide.tipa"
          cp Application/Dopamine.tipa "Application/${artifact}"
          echo "artifact=${artifact}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: |
            Application/${{ env.artifact }}
            artifacts/source-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REF="${{ github.event.inputs.branch || github.ref_name }}"
          TAG="auto-${SHA:0:10}"
          # 已存在则跳过（幂等）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          BODY="Auto-built from ${REF} @ ${SHA}

Patches applied:
- auto-auth (no-verify supporter license, semantic patch via .github/scripts/auto-auth.py)

Provenance: see source-provenance.txt in assets"
          gh release create "$TAG" \
            "Application/${{ env.artifact }}" \
            --title "Dopamine RH auto build (${REF})" \
            --notes "$BODY"
